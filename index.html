
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>November 2026 To-Do List</title>
<style>
body {
  margin: 0;
  padding: 25px 15px;
  background: #f4f6fb;
  font-family: Arial, sans-serif;
  color: #182238;
}
main {
  max-width: 850px;
  margin: auto;
}
header {
  background: linear-gradient(120deg,#172554,#315efb);
  color: white;
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 20px;
}
h1 { margin: 0 0 8px; }
.panel {
  background: white;
  padding: 20px;
  border-radius: 15px;
  overflow-x: auto;
}
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
button {
  padding: 9px 14px;
  border: 0;
  border-radius: 8px;
  background: #315efb;
  color: white;
  cursor: pointer;
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 550px;
}
th, td {
  padding: 13px 10px;
  text-align: center;
  border-bottom: 1px solid #e7ecf3;
}
th {
  background: #f1f4ff;
  color: #315efb;
}
.priority {
  font-weight: bold;
}
.status {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}
.complete {
  background: #dcfce7;
  color: #15803d;
}
.pending {
  background: #fff0d5;
  color: #b45309;
}
.message {
  margin-top: 15px;
  font-size: 13px;
  color: #718096;
}
</style>
</head>
<body>
<main>
<header>
  <h1>November 2026 To-Do List</h1>
  <p>My Daily Tasks</p>
</header>

<section class="panel">
  <div class="top">
    <h2>My Tasks</h2>
    <button onclick="loadTasks()">Refresh</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Task</th>
        <th>Priority</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="taskList">
      <tr><td colspan="4">Loading tasks...</td></tr>
    </tbody>
  </table>
  <div id="message" class="message"></div>
</section>
</main>

<script>
const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTS1GctseA-gS2pJHBM6zENhx1r1Xl2eYiRkmtGcKtvokQUaqc44HzlBbFH4vARTGTG7Blg3q8mDjG-/pub?output=csv";

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];

    if (c === '"' && quoted && n === '"') {
      cell += '"'; i++;
    } else if (c === '"') {
      quoted = !quoted;
    } else if (c === ',' && !quoted) {
      row.push(cell); cell = "";
    } else if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && n === '\n') i++;
      row.push(cell);
      if (row.some(v => v.trim())) rows.push(row);
      row = []; cell = "";
    } else {
      cell += c;
    }
  }
  row.push(cell);
  if (row.some(v => v.trim())) rows.push(row);
  return rows;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

async function loadTasks() {
  const tbody = document.getElementById("taskList");
  const message = document.getElementById("message");

  tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

  try {
    const response = await fetch(SHEET_URL);
    if (!response.ok) throw new Error("Sheet could not be loaded.");

    const rows = parseCSV(await response.text());
    const headers = rows[0].map(x =>
      x.trim().toLowerCase().replace(/\s/g, "")
    );

    const dateIndex = headers.indexOf("date");
    const taskIndex = headers.indexOf("task");
    const priorityIndex = headers.indexOf("priority");
    const statusIndex = headers.indexOf("status");

    if ([dateIndex, taskIndex, priorityIndex, statusIndex].includes(-1)) {
      throw new Error("Please check the four column headings.");
    }

    const data = rows.slice(1).filter(row =>
      (row[taskIndex] || "").trim()
    );

    if (!data.length) {
      tbody.innerHTML = '<tr><td colspan="4">No tasks found.</td></tr>';
    } else {
      tbody.innerHTML = data.map(row => {
        const status = (row[statusIndex] || "Pending").trim();
        const isComplete = status.toLowerCase() === "complete";

        return `
          <tr>
            <td>${escapeHTML(row[dateIndex])}</td>
            <td>${escapeHTML(row[taskIndex])}</td>
            <td class="priority">${escapeHTML(row[priorityIndex])}</td>
            <td>
              <span class="status ${isComplete ? "complete" : "pending"}">
                ${escapeHTML(status)}
              </span>
            </td>
          </tr>`;
      }).join("");
    }

    message.textContent = "Google Sheet connected successfully.";
  } catch (error) {
    tbody.innerHTML =
      '<tr><td colspan="4">Unable to load tasks.</td></tr>';
    message.textContent = error.message +
      " If CORS blocks the CSV request, use a JSONP or server-side connection.";
  }
}

loadTasks();
</script>
</body>
</html>
